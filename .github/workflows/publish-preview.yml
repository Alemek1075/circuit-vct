name: Publish public archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet restore src/Circuit/Circuit.csproj
      - run: dotnet build src/Circuit/Circuit.csproj --no-restore -c Release
      - run: node tools/export-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tests/.tmp/circuit-vct
      - uses: actions/deploy-pages@v4
        id: deployment
